duplicates:
  microsoft-dynamics-365: [microsoft-dynamics, navision]
  codat: [codat-io]
  ottimate: [qubiqle]

findings:
  - "A bill agrees almost completely: vendor, due date, lines, total, currency and status are
    all core. Accounts payable is the most standardised corner of accounting."
  - "A ledger account agrees on its number, name, type, currency and balance -- the chart of
    accounts is the same shape in every system that exposes it."
  - "A journal entry agrees only on id, date and description: the lines that carry the
    debits and credits are modelled differently everywhere."
  - "Expenses agree on nothing but an id (14 providers): expense tools, card platforms and
    ledgers each describe a spend differently."
  - "The largest accounting platforms are thin or absent: Intuit's harvested spec covers only
    invoices, customers and payments, and NetSuite, Wave and MYOB publish none the catalog
    holds."
decisions:
  - "Invoices belong to billing and payments to payments; accounting does not duplicate
    them. Its concepts are the ledger side."
  - "A ledger account is `/ledger-accounts`, though most providers say `/accounts`: that word
    is a bank account in banking and a login in identity. Bare `/accounts` counts only at a
    provider that also exposes journal entries."
  - "Vendors, bills, expenses and tax rates need no journal: inside an accounting cohort their
    names are unambiguous, and requiring journals cost most of the providers."
  - "`receipts` is not an expense: reviewed, it was goods received, cash receipts and receipt
    images as often as spend."
  - "Journal entries are `/journal-entries` (13 providers across spellings, against 9 for
    `journals`)."
  - "Duplicates merged: Microsoft Dynamics and Navision into Dynamics 365, Codat, Ottimate."
