context: accounting
name: Accounting
intro: >-
  The common accounting vocabulary -- the chart of accounts, the journal entries posted to
  it, the vendors a business buys from and the bills they send, its expenses and its tax
  rates -- distilled from the APIs that already exist. Invoices belong to the billing
  context and payments to the payments context.
tags: [Accounting, Bookkeeping, ERP, Accounts Payable, General Ledger, AP Automation, Financial Management]

